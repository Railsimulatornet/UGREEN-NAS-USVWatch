name: Python checks

on:
  push:
    branches: [main]
    paths: ['usvwatch/**', 'tests/**', '.github/workflows/python-checks.yml']
  pull_request:
    branches: [main]
    paths: ['usvwatch/**', 'tests/**', '.github/workflows/python-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run SMTP mode tests without network access
        run: python3 -m unittest discover -s tests -v
      - name: Check loop wrapper syntax
        run: sh -n usvwatch/usvwatch-loop.sh
